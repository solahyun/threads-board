<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pick Board</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f3f3;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
.app{max-width:720px;margin:auto;padding:12px}
h1{font-size:21px;margin:2px 0 4px}.sub{font-size:12px;color:#777;margin-bottom:10px}
.panel{background:#fff;border-radius:15px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:7px}.row>*{flex:1}
button,.fileBtn{appearance:none;-webkit-appearance:none;border:0;border-radius:10px;background:#111;color:#fff;padding:12px 8px;font-size:14px;font-weight:750;text-align:center}
button.secondary{background:#e9e9e9;color:#111}button.active{box-shadow:inset 0 0 0 3px #111}
input[type=file]{position:absolute;width:1px;height:1px;opacity:.001;overflow:hidden}
.board{width:100%;aspect-ratio:4/5;display:grid;padding:16px;gap:6px;background:#f2efe9;overflow:hidden}
.board.n4{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}
.board.n6{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
.board.n8{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr)}
.cell{position:relative;overflow:hidden;background:#ddd;touch-action:pan-y}.cell.editing{touch-action:none}
.cell.selected{outline:3px solid #111;outline-offset:-3px}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;pointer-events:none;user-select:none;-webkit-user-drag:none;transform-origin:center}
.num{position:absolute;z-index:3;color:#fff;font:700 38px Georgia,serif;text-shadow:0 1px 5px #0009;pointer-events:none;line-height:1}
.mc{left:50%;top:50%;transform:translate(-50%,-50%)}.tl{left:9px;top:9px}.tc{left:50%;top:9px;transform:translateX(-50%)}.tr{right:9px;top:9px}
.ml{left:9px;top:50%;transform:translateY(-50%)}.mr{right:9px;top:50%;transform:translateY(-50%)}.bl{left:9px;bottom:9px}.bc{left:50%;bottom:9px;transform:translateX(-50%)}.br{right:9px;bottom:9px}
.status{font-size:12px;font-weight:700;margin:9px 0 3px}.hint{font-size:12px;color:#666;line-height:1.5}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.thumb{aspect-ratio:1;position:relative;overflow:hidden;border-radius:8px;background:#eee;border:2px solid transparent}
.thumb.selected{border-color:#111}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{position:absolute;top:3px;left:5px;color:#fff;font-weight:800;text-shadow:0 1px 4px #000}
.control{display:grid;grid-template-columns:55px 1fr 42px;gap:7px;align-items:center;margin:9px 0;font-size:12px}.control input{width:100%}
.setting{display:grid;grid-template-columns:105px 1fr;gap:8px;align-items:center;margin:9px 0;font-size:13px}
.setting select,.setting input[type=text]{width:100%;height:39px;border:1px solid #ddd;border-radius:9px;background:#fff;padding:5px}
.colorrow{display:flex;gap:6px}.colorrow input[type=color]{width:55px;height:39px;border:1px solid #ddd;border-radius:9px}.colorrow input[type=text]{flex:1}
.result{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #eee}.result img{width:100%;display:block;border-radius:8px}
.result button,.result a{display:block;width:100%;margin-top:8px;text-decoration:none;background:#111;color:#fff;border-radius:10px;padding:12px;text-align:center;font-weight:800;font-size:14px}

.previewPanel{padding:10px}
.previewStage{
 padding:8px;
 border:1px solid #d9d9d9;
 border-radius:10px;
 background-color:#e9e9e9;
 background-image:
  linear-gradient(45deg,#dedede 25%,transparent 25%),
  linear-gradient(-45deg,#dedede 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,#dedede 75%),
  linear-gradient(-45deg,transparent 75%,#dedede 75%);
 background-size:16px 16px;
 background-position:0 0,0 8px,8px -8px,-8px 0;
}
.previewStage .board{box-shadow:0 0 0 1px rgba(0,0,0,.12)}

</style>
</head>
<body><main class="app">
<h1>Pick Board</h1><div class="sub">4 · 6 · 8 Grid Maker · 1080 × 1350</div>

<section class="panel">
<div class="row" id="layoutBtns">
<button class="secondary" data-count="4">4컷</button><button class="secondary active" data-count="6">6컷</button><button class="secondary" data-count="8">8컷</button>
</div>
<div class="row" style="margin-top:8px">
<label class="fileBtn" for="fileInput">사진 추가</label>
<input id="fileInput" type="file" accept="image/*" multiple>
<button id="makeBtn">완성 이미지 만들기</button>
</div>
<div id="thumbs" class="thumbs"></div>
</section>

<section class="panel previewPanel">
<div class="previewStage"><div id="board" class="board n6"></div></div>
<div id="status" class="status">사진 추가를 눌러 최대 6장을 선택해줘.</div>
<div class="hint">기본은 스크롤 잠금 상태. 사진 위치를 움직일 때만 아래 ‘사진 위치 편집’을 켜줘.</div>
</section>

<section class="panel">
<div class="control"><span>확대</span><input id="zoom" type="range" min="1" max="4" step=".01" value="1"><output id="zoomOut">1.00</output></div>
<div class="control"><span>좌우</span><input id="moveX" type="range" min="-180" max="180" step="1" value="0"><output id="xOut">0</output></div>
<div class="control"><span>상하</span><input id="moveY" type="range" min="-220" max="220" step="1" value="0"><output id="yOut">0</output></div>
<div class="row" style="margin-bottom:7px"><button id="editMode" class="secondary">🔒 사진 위치 편집</button></div>
<div class="hint" id="editHint" style="margin-bottom:8px">잠금 상태 · 사진 위에서 손가락을 움직여도 페이지가 스크롤돼.</div>
<div class="row"><button id="flipX" class="secondary">↔ 좌우 반전</button><button id="flipY" class="secondary">↕ 상하 반전</button><button id="reset" class="secondary">초기화</button></div>
<div class="row" style="margin-top:7px"><button id="left" class="secondary">← 순서</button><button id="right" class="secondary">순서 →</button><button id="nums" class="secondary">번호 ON</button></div>
</section>

<section class="panel">
<b>보드 설정</b>
<div class="setting"><span>배경색</span><div class="colorrow"><input id="bg" type="color" value="#f2efe9"><input id="hex" type="text" value="#F2EFE9"></div></div>
<div class="setting"><span>번호 위치</span><select id="numPos"><option value="mc">정가운데</option><option value="tl">왼쪽 위</option><option value="tc">가운데 위</option><option value="tr">오른쪽 위</option><option value="ml">왼쪽 가운데</option><option value="mr">오른쪽 가운데</option><option value="bl">왼쪽 아래</option><option value="bc">가운데 아래</option><option value="br">오른쪽 아래</option></select></div>
<div class="setting"><span>번호 글씨체</span><select id="numFont">
<option value="system">기본 고딕</option>
<option value="arialblack">Arial Black</option>
<option value="georgia" selected>Georgia</option>
<option value="times">Times New Roman</option>
</select></div>
<div class="setting"><span>번호 크기</span><input id="numSize" type="range" min="20" max="70" value="38"></div>
<div class="setting"><span>바깥 여백</span><input id="padding" type="range" min="0" max="40" value="16"></div>
<div class="setting"><span>사진 간격</span><input id="gap" type="range" min="0" max="24" value="6"></div>

<div id="resultBox" class="result">
<b>완성 이미지</b><div class="hint">아이폰은 공유 버튼 → ‘이미지 저장’을 사용하면 가장 안정적이야.</div>
<img id="resultImg" alt="완성 이미지">
<button id="shareBtn" style="display:none">공유 / 사진에 저장</button>

</div>
</section>
</main>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
let count=6, items=[], selected=0, showNumbers=true, editMode=false, resultURL=null, resultFile=null;
const board=$("board");

function readFile(file){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();
  r.onload=()=>resolve(r.result); r.onerror=()=>reject(r.error||new Error("파일 읽기 실패"));
  r.readAsDataURL(file);
 });
}
function loadImage(src){
 return new Promise((resolve,reject)=>{
  const im=new Image(); im.onload=()=>resolve(im); im.onerror=()=>reject(new Error("이미지 로드 실패")); im.src=src;
 });
}
function newItem(src){return {src:src,z:1,x:0,y:0,fx:1,fy:1};}
function transform(a){return "translate("+a.x+"px,"+a.y+"px) scale("+(a.fx*a.z)+","+(a.fy*a.z)+")";}

function buildBoard(){
 board.innerHTML=""; board.className="board n"+count;
 for(let i=0;i<count;i++){
  const cell=document.createElement("div"); cell.className="cell"; cell.dataset.index=i;
  const img=document.createElement("img"); const num=document.createElement("span");
  num.className="num "+$("numPos").value; num.textContent=String(i+1);
  cell.appendChild(img); cell.appendChild(num); board.appendChild(cell);
  cell.addEventListener("click",()=>select(i));
  addTouch(cell,i);
 }
 if(selected>=count) selected=Math.max(0,count-1);
 render();
 select(selected);applyEditMode();
}
function render(){
 [...board.children].forEach((cell,i)=>{
  const im=cell.querySelector("img"), a=items[i];
  if(a){im.src=a.src; im.style.display="block"; im.style.transform=transform(a);}
  else{im.removeAttribute("src"); im.style.display="none";}
 });
 renderThumbs(); applyDesign();
 $("status").textContent=items.length ? items.length+"장 보관 중 · 현재 "+count+"컷 표시 · "+(selected+1)+"번 편집 중" : "사진 추가를 눌러 최대 "+count+"장을 선택해줘.";
}
function renderThumbs(){
 const box=$("thumbs"); box.innerHTML="";
 items.forEach((a,i)=>{
  const d=document.createElement("div"); d.className="thumb"+(i===selected?" selected":"");
  const im=document.createElement("img"); im.src=a.src;
  const s=document.createElement("span"); s.textContent=String(i+1);
  d.appendChild(im);d.appendChild(s);d.addEventListener("click",()=>select(i));box.appendChild(d);
 });
}
function select(i){
 if(i<0||i>=items.length)return;
 if(i>=count){selected=i;[...board.children].forEach(c=>c.classList.remove("selected"));[...$("thumbs").children].forEach((c,j)=>c.classList.toggle("selected",j===i));syncControls();return;}
 selected=i;
 [...board.children].forEach((c,j)=>c.classList.toggle("selected",j===i));
 [...$("thumbs").children].forEach((c,j)=>c.classList.toggle("selected",j===i));
 syncControls();
}
function syncControls(){
 const a=items[selected]||{z:1,x:0,y:0};
 $("zoom").value=a.z;$("moveX").value=a.x;$("moveY").value=a.y;
 $("zoomOut").textContent=(+a.z).toFixed(2);$("xOut").textContent=Math.round(a.x);$("yOut").textContent=Math.round(a.y);
}
function applyEditMode(){
 [...board.children].forEach(c=>c.classList.toggle("editing",editMode));
 $("editMode").textContent=editMode?"🔓 위치 편집 ON":"🔒 사진 위치 편집";
 $("editMode").classList.toggle("active",editMode);
 $("editHint").textContent=editMode?"편집 중 · 한 손가락 이동 / 두 손가락 확대·축소":"잠금 상태 · 사진 위에서 손가락을 움직여도 페이지가 스크롤돼.";
}
function fontStack(){
 const v=$("numFont").value;
 if(v==="arialblack")return '"Arial Black","Arial Bold",Arial,sans-serif';
 if(v==="georgia")return 'Georgia,"Times New Roman",serif';
 if(v==="times")return '"Times New Roman",Times,serif';
 return '-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif';
}
function applyDesign(){
 board.style.backgroundColor=$("bg").value;board.style.padding=$("padding").value+"px";board.style.gap=$("gap").value+"px";
 board.querySelectorAll(".num").forEach(n=>{n.className="num "+$("numPos").value;n.style.fontSize=$("numSize").value+"px";n.style.fontFamily=fontStack();n.style.display=showNumbers?"block":"none";});
}
function addTouch(cell,index){
 let mode="",sx=0,sy=0,ox=0,oy=0,startDist=0,startZoom=1;
 cell.addEventListener("touchstart",e=>{
  if(!items[index]||!editMode)return; select(index);
  if(e.touches.length===1){mode="move";sx=e.touches[0].clientX;sy=e.touches[0].clientY;ox=items[index].x;oy=items[index].y;}
  else if(e.touches.length===2){mode="pinch";startDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);startZoom=items[index].z;}
 },{passive:true});
 cell.addEventListener("touchmove",e=>{
  if(!items[index]||!editMode)return;
  if(mode==="move"&&e.touches.length===1){e.preventDefault();items[index].x=ox+(e.touches[0].clientX-sx);items[index].y=oy+(e.touches[0].clientY-sy);}
  else if(mode==="pinch"&&e.touches.length===2){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);items[index].z=Math.max(1,Math.min(4,startZoom*(d/startDist)));}
  const im=cell.querySelector("img");im.style.transform=transform(items[index]);syncControls();
 },{passive:false});
 cell.addEventListener("touchend",()=>{mode="";},{passive:true});
}

$("fileInput").addEventListener("change",async e=>{
 const files=Array.from(e.target.files||[]);
 if(!files.length)return;
 $("status").textContent="사진 불러오는 중…";
 try{
  const free=Math.max(0,8-items.length), chosen=files.slice(0,free);
  if(!chosen.length){alert("사진은 최대 8장까지 보관할 수 있어.");return;}
  for(const f of chosen){const src=await readFile(f);await loadImage(src);items.push(newItem(src));}
  selected=Math.max(0,items.length-chosen.length);render();select(selected);
 }catch(err){console.error(err);alert("사진을 불러오지 못했어. 다른 사진으로 다시 시도해줘.");}
 finally{e.target.value="";}
});

$("layoutBtns").addEventListener("click",e=>{
 const b=e.target.closest("[data-count]");if(!b)return;
 count=Number(b.dataset.count);
 [...$("layoutBtns").children].forEach(x=>x.classList.toggle("active",x===b));buildBoard();
});
[["zoom","z"],["moveX","x"],["moveY","y"]].forEach(([id,key])=>{
 $(id).addEventListener("input",()=>{if(!items[selected])return;items[selected][key]=Number($(id).value);render();select(selected);});
});
$("editMode").onclick=()=>{editMode=!editMode;applyEditMode();};
$("flipX").onclick=()=>{if(items[selected]){items[selected].fx*=-1;render();select(selected);}};
$("flipY").onclick=()=>{if(items[selected]){items[selected].fy*=-1;render();select(selected);}};
$("reset").onclick=()=>{if(items[selected]){Object.assign(items[selected],{z:1,x:0,y:0,fx:1,fy:1});render();select(selected);}};
$("left").onclick=()=>{if(selected>0&&items[selected]){[items[selected-1],items[selected]]=[items[selected],items[selected-1]];selected--;render();select(selected);}};
$("right").onclick=()=>{if(selected<items.length-1){[items[selected+1],items[selected]]=[items[selected],items[selected+1]];selected++;render();select(selected);}};
$("nums").onclick=()=>{showNumbers=!showNumbers;$("nums").textContent="번호 "+(showNumbers?"ON":"OFF");applyDesign();};
$("bg").oninput=()=>{$("hex").value=$("bg").value.toUpperCase();applyDesign();};
$("hex").onchange=()=>{if(/^#[0-9a-f]{6}$/i.test($("hex").value)){$("bg").value=$("hex").value;applyDesign();}};
["numPos","numFont","numSize","padding","gap"].forEach(id=>$(id).addEventListener("input",applyDesign));

$("makeBtn").addEventListener("click",async()=>{
 if(!items.length){alert("사진을 먼저 추가해줘.");return;}
 const btn=$("makeBtn"), old=btn.textContent;btn.disabled=true;btn.textContent="만드는 중…";
 try{
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;
  const g=c.getContext("2d",{alpha:false});if(!g)throw new Error("canvas");
  const pad=Number($("padding").value)/16*26, gap=Number($("gap").value)/6*8;
  const cols=count===4?2:(count===6?3:4),rows=2;
  const cw=(W-pad*2-gap*(cols-1))/cols,ch=(H-pad*2-gap*(rows-1))/rows;
  g.fillStyle=$("bg").value;g.fillRect(0,0,W,H);
  for(let i=0;i<Math.min(count,items.length);i++){
   const a=items[i],im=await loadImage(a.src),cx=pad+(i%cols)*(cw+gap),cy=pad+Math.floor(i/cols)*(ch+gap);
   const base=Math.max(cw/im.naturalWidth,ch/im.naturalHeight),sc=base*a.z,dw=im.naturalWidth*sc,dh=im.naturalHeight*sc;
   g.save();g.beginPath();g.rect(cx,cy,cw,ch);g.clip();g.translate(cx+cw/2+a.x*2,cy+ch/2+a.y*2);g.scale(a.fx,a.fy);g.drawImage(im,-dw/2,-dh/2,dw,dh);g.restore();
   if(showNumbers){
    const p=$("numPos").value;let nx=cx+cw/2,ny=cy+ch/2,align="center",baseLine="middle",o=18;
    if(p[1]==="l"){nx=cx+o;align="left";}if(p[1]==="r"){nx=cx+cw-o;align="right";}
    if(p[0]==="t"){ny=cy+o;baseLine="top";}if(p[0]==="b"){ny=cy+ch-o;baseLine="bottom";}
    const previewW=board.getBoundingClientRect().width||360;const numberScale=W/previewW;g.font="bold "+(Number($("numSize").value)*numberScale)+"px "+fontStack();g.textAlign=align;g.textBaseline=baseLine;g.fillStyle="#fff";g.shadowColor="#0009";g.shadowBlur=6;g.fillText(String(i+1),nx,ny);g.shadowBlur=0;
   }
  }
  const blob=await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error("blob")),"image/jpeg",0.98));
  if(resultURL)URL.revokeObjectURL(resultURL);
  resultURL=URL.createObjectURL(blob);resultFile=new File([blob],"threads-board-"+count+"cut-1080x1350.jpg",{type:"image/jpeg"});
  $("resultImg").src=resultURL;
  const canShare=navigator.share && (!navigator.canShare || navigator.canShare({files:[resultFile]}));
  $("shareBtn").style.display=canShare?"block":"none";
  $("resultBox").style.display="block";$("resultBox").scrollIntoView({behavior:"smooth",block:"start"});
 }catch(err){console.error(err);alert("완성 이미지 생성에 실패했어. Safari를 새로고침한 뒤 다시 시도해줘.");}
 finally{btn.disabled=false;btn.textContent=old;}
});
$("shareBtn").addEventListener("click",async()=>{
 if(!resultFile)return;
 try{await navigator.share({files:[resultFile],title:"스레드 패션 보드"});}
 catch(err){if(err.name!=="AbortError"){console.error(err);alert("공유창을 열지 못했어. JPG 파일 저장을 이용해줘.");}}
});
buildBoard();
})();
</script>
</body></html>
