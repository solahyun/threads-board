<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f0ea"><link rel="manifest" href="manifest.webmanifest"><title>Thread Board</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.app{max-width:760px;margin:auto;padding:14px}.head h1{font-size:23px;margin:4px 0}.sub{font-size:12px;color:#707070;margin-bottom:12px}.panel{background:#fff;border-radius:16px;padding:12px;margin-bottom:11px}.row{display:flex;gap:7px;flex-wrap:wrap}.btn,label.btn{border:0;border-radius:11px;padding:11px 13px;background:#171717;color:#fff;font-weight:750;font-size:14px;cursor:pointer}.btn.alt{background:#ececec;color:#171717}.btn.active{outline:3px solid #aaa}input[type=file]{position:absolute;left:-9999px}.board{aspect-ratio:4/5;background:#f3f0ea;padding:12px;display:grid;gap:6px;overflow:hidden}.cell{position:relative;overflow:hidden;background:#dedede;touch-action:none}.cell.sel{outline:3px solid #111;outline-offset:-3px}.cell img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center;pointer-events:none}.num{position:absolute;left:8px;top:5px;color:#fff;font:800 30px Georgia,serif;text-shadow:0 1px 5px #0009}.status{font-size:12px;font-weight:700;margin-top:8px}.control{display:grid;grid-template-columns:55px 1fr 42px;gap:8px;align-items:center;margin:10px 0;font-size:12px}.control input{width:100%}.hint{font-size:12px;color:#666;line-height:1.5}.layouts{margin-bottom:10px}@media(min-width:700px){.app{padding:22px}.board{padding:18px;gap:8px}}
</style></head><body><main class="app"><header class="head"><h1>스레드 패션 보드</h1><div class="sub">Safari용 · 4 / 6 / 8컷 · 사진은 서버로 전송하지 않고 기기에서만 처리</div></header>
<section class="panel"><div class="row layouts"><button class="btn alt" data-n="4">4컷</button><button class="btn alt active" data-n="6">6컷</button><button class="btn alt" data-n="8">8컷</button></div><div class="row"><label class="btn" for="picker">사진 선택</label><input id="picker" type="file" accept="image/*" multiple><button class="btn" id="save">JPG 저장</button></div><div id="status" class="status">6장의 사진을 선택해주세요.</div></section>
<section class="panel"><div id="board" class="board"></div></section>
<section class="panel"><div class="hint">보드에서 사진을 터치한 뒤 확대/상하/좌우를 조절하세요. 얼굴, 지그재그 UI, 슬라이드 점은 확대 후 위치를 움직여 잘라낼 수 있어요.</div><div class="control"><span>확대</span><input id="zoom" type="range" min="1" max="3" step=".01" value="1"><output id="zo">1.00</output></div><div class="control"><span>좌우</span><input id="xx" type="range" min="-120" max="120" value="0"><output id="xo">0</output></div><div class="control"><span>상하</span><input id="yy" type="range" min="-120" max="120" value="0"><output id="yo">0</output></div><div class="row"><button class="btn alt" id="back">← 순서</button><button class="btn alt" id="forward">순서 →</button><button class="btn alt" id="reset">크롭 초기화</button><button class="btn alt" id="nums">번호 ON</button></div></section>
<script>
const $=id=>document.getElementById(id);let count=6,items=[],sel=0,showNums=true;const board=$('board');
function spec(){return count===4?[2,2]:count===8?[4,2]:[3,2]}
function build(){let [cols,rows]=spec();board.style.gridTemplateColumns=`repeat(${cols},1fr)`;board.style.gridTemplateRows=`repeat(${rows},1fr)`;board.innerHTML='';for(let i=0;i<count;i++){let d=document.createElement('div');d.className='cell'+(i===sel?' sel':'');d.dataset.i=i;d.innerHTML=`<img style="display:none"><span class="num">${i+1}</span>`;d.onclick=()=>{sel=i;render();sync()};board.appendChild(d)}render()}
function render(){[...board.children].forEach((c,i)=>{c.classList.toggle('sel',i===sel);let a=items[i],im=c.querySelector('img');if(a){im.src=a.src;im.style.display='block';im.style.transform=`translate(${a.x}px,${a.y}px) scale(${a.z})`}else im.style.display='none';c.querySelector('.num').style.display=showNums?'block':'none'});$('status').textContent=items.length?`${items.length}/${count}장 · ${Math.min(sel+1,count)}번 편집 중`:`${count}장의 사진을 선택해주세요.`}
function sync(){let a=items[sel]||{z:1,x:0,y:0};$('zoom').value=a.z;$('xx').value=a.x;$('yy').value=a.y;$('zo').value=(+a.z).toFixed(2);$('xo').value=a.x;$('yo').value=a.y}
function read(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
$('picker').onchange=async e=>{let fs=[...e.target.files].slice(0,count);$('status').textContent='불러오는 중…';try{let srcs=await Promise.all(fs.map(read));items=srcs.map(src=>({src,z:1,x:0,y:0}));sel=0;build();sync()}catch(err){$('status').textContent='사진을 불러오지 못했습니다.'}$('picker').value=''};
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{count=+b.dataset.n;document.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('active',x===b));items=items.slice(0,count);sel=Math.min(sel,count-1);build();sync()});
[$('zoom'),$('xx'),$('yy')].forEach(el=>el.oninput=()=>{if(!items[sel])return;items[sel].z=+$('zoom').value;items[sel].x=+$('xx').value;items[sel].y=+$('yy').value;sync();render()});
$('back').onclick=()=>{if(sel<1||!items[sel])return;[items[sel-1],items[sel]]=[items[sel],items[sel-1]];sel--;render();sync()};$('forward').onclick=()=>{if(sel>=items.length-1)return;[items[sel+1],items[sel]]=[items[sel],items[sel+1]];sel++;render();sync()};$('reset').onclick=()=>{if(!items[sel])return;Object.assign(items[sel],{z:1,x:0,y:0});render();sync()};$('nums').onclick=()=>{showNums=!showNums;$('nums').textContent='번호 '+(showNums?'ON':'OFF');render()};
function load(src){return new Promise((ok,no)=>{let im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src})}
$('save').onclick=async()=>{if(!items.length){alert('사진을 먼저 선택해주세요.');return}let C=document.createElement('canvas');C.width=1080;C.height=1350,g=C.getContext('2d'),m=24,gap=7,[cols,rows]=spec(),w=(1080-2*m-(cols-1)*gap)/cols,h=(1350-2*m-(rows-1)*gap)/rows;g.fillStyle='#f3f0ea';g.fillRect(0,0,1080,1350);for(let i=0;i<Math.min(items.length,count);i++){let im=await load(items[i].src),a=items[i],col=i%cols,row=Math.floor(i/cols),cx=m+col*(w+gap),cy=m+row*(h+gap),base=Math.max(w/im.naturalWidth,h/im.naturalHeight),sc=base*a.z,dw=im.naturalWidth*sc,dh=im.naturalHeight*sc;g.save();g.beginPath();g.rect(cx,cy,w,h);g.clip();g.drawImage(im,cx+(w-dw)/2+a.x*2,cy+(h-dh)/2+a.y*2,dw,dh);g.restore();if(showNums){g.font='bold 48px Georgia';g.fillStyle='#fff';g.shadowColor='#0009';g.shadowBlur=5;g.fillText(String(i+1),cx+12,cy+52);g.shadowBlur=0}}let blob=await new Promise(r=>C.toBlob(r,'image/jpeg',.96));let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`threads-board-${count}.jpg`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});build();sync();
</script></main></body></html>
